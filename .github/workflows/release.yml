# Builds the mod and attaches the jar whenever a GitHub Release is published.
name: Release jar

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Attach jar to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd build/libs
          for f in *.jar; do sha256sum "$f" > "$f.sha256"; done
          gh release upload "${{ github.event.release.tag_name }}" *.jar *.sha256 --clobber

      - uses: actions/upload-artifact@v4
        with:
          name: villagerchatter-jar
          path: build/libs/*.jar
